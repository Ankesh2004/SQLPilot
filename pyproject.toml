[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "sqlpilot"
version = "0.1.0"
description = "Text-to-SQL engine with built-in clarification — asks before it guesses"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # orchestration
    "langgraph>=0.4.0",
    "langchain-core>=0.3.0",

    # LLM providers (provider-agnostic, start with Gemini)
    "google-genai>=1.0.0",
    "groq>=1.0.0",

    # RAG: vector store + embeddings (chroma bundles an ONNX MiniLM embedder)
    "chromadb>=0.6.0",

    # SQL validation
    "sqlglot>=26.0.0",

    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",

    # observability -- pinned below v3's OTEL rewrite (different API)
    "langfuse>=2.60.0,<3.0.0",

    # database
    "asyncpg>=0.30.0",        # postgres async driver (production)
    # sqlite is built-in, no extra dep needed for demos

    # utilities
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]
streamlit = [
    "streamlit>=1.40.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
