name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"

      # Advisory for now: the codebase has a pre-existing ruff backlog
      # (mostly line length and import order, plus deliberate E402s where
      # load_dotenv() must run before app imports). Flip to blocking once
      # that's cleaned up.
      - name: Lint (advisory)
        continue-on-error: true
        run: ruff check .

      # /schema and the introspector read the demo database, so build it first.
      # Seeding is offline and takes a couple of seconds; no API key needed.
      - name: Seed demo database
        run: python scripts/seed_database.py

      - name: Unit tests
        run: pytest tests/unit -v

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: sqlpilot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the image can import the app and serve a request. The pipeline
      # itself needs an LLM key, so this stops at the health endpoint.
      - name: Smoke test the image
        run: |
          docker run -d --name sqlpilot-ci -p 8000:8000 sqlpilot:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo "healthy"; exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"
          docker logs sqlpilot-ci
          exit 1

      - name: Container logs on failure
        if: failure()
        run: docker logs sqlpilot-ci || true
